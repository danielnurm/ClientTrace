# Secret scan, Python tests (including the real-browser test against the local fake pharmacy) and the web checks,
# on every push to main and every PR.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so the scan sees every commit
      - name: Secret scan (gitleaks)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner .

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12 && uv pip install -r requirements.txt
      - name: Install Chromium for the browser test
        run: .venv/bin/python -m playwright install --with-deps chromium
      - name: Unit and browser tests (offline)
        env:
          REQUIRE_BROWSER: "1"   # the browser test must run here, not skip
        run: .venv/bin/python -m unittest discover -s tests -t .

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
